name: Bug Report
description: Report a bug in Worship Studio
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill out the sections below so we can reproduce and fix the issue.
  - type: input
    id: version
    attributes:
      label: App Version
      description: "Find in Help → About Worship Studio"
      placeholder: "2.0.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows Version
      placeholder: "Windows 11 23H2 (Build 22631.x)"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - "Simple Mode"
        - "Full Mode"
        - "Both / Not sure"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: "Numbered steps that reliably trigger the bug"
      placeholder: |
        1. Open Worship Studio
        2. Create a new song with...
        3. Add to service...
        4. Go Live → observe error
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: "What should have happened?"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: "What actually happened? Include error messages."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnostic Logs
      description: "Help → Export Diagnostics, then paste relevant lines (remove private data)"
      render: text
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: "I have searched existing issues for duplicates"
        - label: "I can reproduce this consistently"
        - label: "This is not a feature request"
