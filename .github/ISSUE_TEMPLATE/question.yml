name: Question / Help
description: Ask a question about usage or configuration
title: "[Question]: "
labels: ["question", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Have a question about how to do something? Check the Welcome Guide (Help → Welcome Guide) first, then ask here.
  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: "What are you trying to accomplish?"
      placeholder: "How do I set up a stage display for our worship team?"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App Version (if relevant)
      placeholder: "2.0.0"
